name: Terraform deploy
description: Package and terraform apply the Bedrock inference Lambda in the root account
inputs:
  aws-access-key-id:
    required: true
    description: Access key for IAM user gha-deploy, used to call sts:AssumeRole
  aws-secret-access-key:
    required: true
    description: Secret key used to call sts:AssumeRole
  role-to-assume:
    required: true
    description: Role assumed with STS AssumeRole
  role-session-name:
    required: false
    default: gha-deploy
runs:
  using: composite
  steps:
    - name: Check required secrets
      shell: bash
      env:
        DEPLOY_ROLE: ${{ inputs.role-to-assume }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
      run: |
        missing=0
        if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
          echo "::error::Set repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for IAM user gha-deploy."
          missing=1
        fi
        if [ -z "$DEPLOY_ROLE" ]; then
          echo "::error::Missing role ARN for sts:AssumeRole."
          missing=1
        fi
        if [ -z "$API_KEY" ]; then
          echo "::error::Missing repository secret INFERENCE_API_KEY"
          missing=1
        fi
        exit "$missing"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Assume deploy role (STS)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: ${{ inputs.role-session-name }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Package Lambda
      shell: bash
      run: ./scripts/package-lambda.sh terraform/.build/lambda.zip

    - name: Deploy
      shell: bash
      env:
        SKIP_PACKAGE: "1"
      run: ./scripts/tf-deploy.sh
