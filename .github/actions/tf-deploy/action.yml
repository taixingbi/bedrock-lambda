name: Terraform deploy
description: Assume the environment role and apply infra or publish app code
inputs:
  role-to-assume:
    required: true
    description: Role assumed with STS AssumeRoleWithWebIdentity
  tf-env:
    required: true
    description: dev or prod
  command:
    required: false
    default: apply
    description: apply (terraform) or app (update-function-code)
  role-session-name:
    required: false
    default: gha-oidc
runs:
  using: composite
  steps:
    - name: Check required secrets
      shell: bash
      env:
        DEPLOY_ROLE: ${{ inputs.role-to-assume }}
        COMMAND: ${{ inputs.command }}
      run: |
        missing=0
        if [ -z "$DEPLOY_ROLE" ]; then
          echo "::error::Missing role ARN for sts:AssumeRoleWithWebIdentity."
          missing=1
        fi
        if [ "$COMMAND" = "apply" ] && [ -z "$API_KEY" ]; then
          echo "::error::Missing repository secret INFERENCE_API_KEY"
          missing=1
        fi
        exit "$missing"

    - name: Set up Python
      if: ${{ inputs.command == 'apply' || inputs.command == 'app' }}
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set up Terraform
      if: ${{ inputs.command == 'apply' }}
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Assume deploy role (STS)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: ${{ inputs.role-session-name }}-${{ inputs.tf-env }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Apply infra
      if: ${{ inputs.command == 'apply' }}
      shell: bash
      env:
        SKIP_PACKAGE: "0"
      run: ./scripts/tf.sh apply ${{ inputs.tf-env }}

    - name: Publish app code
      if: ${{ inputs.command == 'app' }}
      shell: bash
      run: ./scripts/app-deploy.sh ${{ inputs.tf-env }}
