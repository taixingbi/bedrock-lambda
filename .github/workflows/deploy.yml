name: Deploy

# Each push to main applies infra, publishes the app code, then validates the Function URL.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::767579108272:role/github-actions-deploy' }}

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/tf-deploy
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          MODEL_ID: ${{ vars.MODEL_ID }}
          MODEL_MAP: ${{ vars.MODEL_MAP }}

  app:
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/tf-deploy
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          command: app
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

  validate:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gha-validate
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
        run: ./scripts/validate.sh
